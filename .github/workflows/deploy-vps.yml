name: Deploy Ionic (VPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  bundles:
    name: 📲🌎 Web + Native bundles → VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - type: Web
            script: bundle-web-update
          - type: Native
            script: bundle-live-update
    steps:
      - name: 💻 Get the latest code
        uses: actions/checkout@v4
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install Ionic Dependencies
        run: npm ci
      - name: ⭐️ Setting project as "production"
        run: npm run ensure-production
      - name: 🔨 Build (${{ matrix.type }})
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npm run ${{ matrix.script }}
      - name: 🗳️ Get Bundle name
        id: zip_file
        run: |
          zip_file=$(ls dist/*.zip | head -n 1)
          echo "zip_file=$zip_file" >> $GITHUB_OUTPUT
          echo "zip_basename=$(basename "$zip_file")" >> $GITHUB_OUTPUT

      - name: 🔐 Tailscale (tag:ci, só SSH na VPS)
        uses: tailscale/github-action@v4
        with:
          # Credencial OIDC do Tailscale (sem segredo): só repo:brunoinds/maranatha-*, só gera chaves tag:ci
          oauth-client-id: TBERsbsTsB11CNTRL-kXDtT6kwp621CNTRL
          audience: api.tailscale.com/TBERsbsTsB11CNTRL-kXDtT6kwp621CNTRL
          tags: tag:ci
      - name: 🔑 Chave SSH do usuário deploy
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}

      - name: 🚀 Load Bundle no container web da API
        env:
          ZIP: ${{ steps.zip_file.outputs.zip_file }}
          NAME: ${{ steps.zip_file.outputs.zip_basename }}
          TYPE: ${{ matrix.type }}
        # O nome do zip tem parênteses (versão e mínima nativa, lidas pelo app:load-bundle):
        # sobe com nome neutro e o nome real vai escapado para o shell remoto
        run: |
          scp -o StrictHostKeyChecking=accept-new "$ZIP" "deploy@prolux-vps:/tmp/upload-$TYPE.zip"
          ssh deploy@prolux-vps "bash -s -- $(printf '%q' "$NAME") $TYPE" <<'EOF'
          set -euo pipefail
          NAME="$1"; TYPE="$2"
          C=$(docker ps --filter label=service=maranatha-api --filter label=role=web --format '{{.Names}}' | head -n 1)
          test -n "$C"
          docker cp "/tmp/upload-$TYPE.zip" "$C:/tmp/$NAME"
          rm -f "/tmp/upload-$TYPE.zip"
          docker exec "$C" php artisan app:load-bundle --type="$TYPE" --filepath="/tmp/$NAME"
          # docker cp grava como root; o container roda como www-data
          docker exec -u root "$C" rm -f "/tmp/$NAME"
          EOF
